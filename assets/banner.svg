<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 15s linear infinite;
    }
    .glow-box {
      animation: borderGlow 4s ease-in-out infinite alternate;
    }
    .badge-float {
      animation: float 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
    @keyframes borderGlow {
      0% { opacity: 0.5; }
      100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }
  </style>

  <!-- Card Background -->
  <rect x="10" y="10" width="980" height="300" rx="16" fill="url(#bgGradient)" stroke="url(#accentBorder)" stroke-width="2" class="glow-box" />

  <!-- Grid Tech Lines -->
  <path d="M 50 40 L 950 40 M 50 280 L 950 280 M 300 10 L 300 310 M 700 10 L 700 310" stroke="#334155" stroke-opacity="0.25" stroke-width="1" />
  <line x1="10" y1="10" x2="990" y2="10" stroke="url(#accentBorder)" stroke-width="3" />

  <!-- Status Pill -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="14" r="5" fill="#10b981" class="pulse-dot" />
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ATS AUTOMATION ENGINE v1.0</text>
  </g>

  <!-- Tag Pill Right -->
  <g transform="translate(720, 45)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="14" r="5" fill="#a855f7" class="pulse-dot" />
    <text x="28" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">HUMAN-IN-THE-LOOP VERIFIED</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="125" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
    ATS Resume Automation Engine
  </text>

  <!-- Subtitle -->
  <text x="50" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Factual ATS-Tailored Resumes (Markdown, DOCX, PDF) &amp; Deterministic Scoring for Marketing
  </text>

  <text x="50" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Targeting Performance Marketing &bull; Digital Marketing &bull; Growth &bull; Paid Search &amp; Social
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(50, 220)">
    <!-- Pill 1 -->
    <g class="badge-float" style="animation-delay: 0s;">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">100% FACTUAL</text>
      <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Zero Hallucinations</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)" class="badge-float" style="animation-delay: 0.4s;">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">MULTI-FORMAT</text>
      <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">PDF &bull; DOCX &bull; MD</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(360, 0)" class="badge-float" style="animation-delay: 0.8s;">
      <rect x="0" y="0" width="175" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">DETERMINISTIC</text>
      <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Transparent 7-Factor Fit</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(550, 0)" class="badge-float" style="animation-delay: 1.2s;">
      <rect x="0" y="0" width="170" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">OFFLINE READY</text>
      <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Works without API keys</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(735, 0)" class="badge-float" style="animation-delay: 1.6s;">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">SQLITE TRACKER</text>
      <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Audit Trail &amp; Analytics</text>
    </g>
  </g>
</svg>
